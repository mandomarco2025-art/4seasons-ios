name: Test Simulator Appetize

on:
  workflow_dispatch:

jobs:
  build-simulator:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cp package-ios.json package.json
          npm install

      - name: Install Pods
        run: |
          cd ios/App
          pod install

      - name: Build for iOS Simulator
        run: |
          cd ios/App
          xcodebuild clean build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ./build_sim \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Appetize Test Build
        run: |
          mkdir -p final_output
          APP_DIR=$(find ios/App/build_sim -name "App.app" -type d | head -n 1)
          cd $(dirname "$APP_DIR")
          zip -r -X /Users/runner/work/site/site/final_output/4Seasons-Appetize-Test.zip App.app

      - name: Upload Test Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 4Seasons-Appetize-Test
          path: final_output/4Seasons-Appetize-Test.zip
