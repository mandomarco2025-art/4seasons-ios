name: Test Simulator Appetize

on:
  workflow_dispatch:

jobs:
  build-simulator:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cp package-ios.json package.json
          npm install

      - name: Install Pods
        run: |
          cd ios/App
          pod install

      - name: Build for iOS Simulator
        run: |
          cd ios/App
          xcodebuild clean build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Appetize Test Build
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "App.app" -type d | head -n 1)
          cd $(dirname "$APP_PATH")
          zip -r 4Seasons-Appetize-Test.zip App.app
          mkdir -p /Users/runner/work/test_out
          mv 4Seasons-Appetize-Test.zip /Users/runner/work/test_out/

      - name: Upload Test Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 4Seasons-Appetize-Test
          path: /Users/runner/work/test_out/4Seasons-Appetize-Test.zip
