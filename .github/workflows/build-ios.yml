name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor Dependencies
        run: |
          npm install @capacitor/core @capacitor/ios --no-package-lock --legacy-peer-deps

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Build iOS Project
        run: |
          cd ios/App
          xcodebuild clean build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package App to ZIP
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "App.app" -type d | head -n 1)
          if [ -d "$APP_PATH" ]; then
            cp -r "$APP_PATH" build/Payload/
            cd build
            zip -r 4Seasons-iOS-App.zip Payload/
          else
            echo "App build output not found, listing directory:"
            find ~/Library/Developer/Xcode/DerivedData -maxdepth 5
            exit 1
          fi

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 4Seasons-iOS-App
          path: build/4Seasons-iOS-App.zip
